<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="defGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="defShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#defShadow)">
    <!-- Harmonic Soundwave Rings -->
    <circle cx="50" cy="50" r="42" stroke="url(#defGold)" stroke-width="1.8" stroke-dasharray="6 4" opacity="0.4"/>
    <circle cx="50" cy="50" r="34" stroke="url(#defGold)" stroke-width="1.2" opacity="0.3"/>

    <!-- BEAMED EIGHTH NOTES (Pair) -->
    <!-- Heavy Double Beam on Top -->
    <polygon points="26,30 68,20 68,27 26,37" fill="url(#defGold)" stroke="#fef08a" stroke-width="1"/>
    <polygon points="26,42 68,32 68,37 26,47" fill="url(#defGold)" stroke="#fef08a" stroke-width="1"/>

    <!-- Left Stem -->
    <line x1="28" y1="33" x2="28" y2="72" stroke="url(#defGold)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="28" y1="33" x2="28" y2="72" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Left Note Head (3D Slanted Ellipse) -->
    <ellipse cx="22" cy="72" rx="10" ry="7" fill="url(#defGold)" stroke="#fef08a" stroke-width="2" transform="rotate(-25 22 72)"/>
    <ellipse cx="20" cy="71" rx="4.5" ry="2.2" fill="#78350f" transform="rotate(-25 20 71)"/>

    <!-- Right Stem -->
    <line x1="66" y1="23" x2="66" y2="62" stroke="url(#defGold)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="66" y1="23" x2="66" y2="62" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Right Note Head (3D Slanted Ellipse) -->
    <ellipse cx="60" cy="62" rx="10" ry="7" fill="url(#defGold)" stroke="#fef08a" stroke-width="2" transform="rotate(-25 60 62)"/>
    <ellipse cx="58" cy="61" rx="4.5" ry="2.2" fill="#78350f" transform="rotate(-25 58 61)"/>

    <!-- GLOWING TREBLE CLEF ACCENT (Chiave di Violino in Gold) -->
    <path d="M78 40 C75 32 82 24 86 28 C90 32 82 38 78 42 C72 48 76 60 84 58 C90 56 92 48 88 44" 
          stroke="url(#defGold)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="24" r="2.5" fill="#fef08a"/>

    <!-- Sparkling Golden Stars -->
    <polygon points="15,22 17,27 22,28 18,31 19,36 15,33 11,36 12,31 8,28 13,27" fill="#fef08a"/>
    <polygon points="82,72 83.5,75 87,76 84,78 85,82 82,80 79,82 80,78 77,76 80.5,75" fill="#fef08a"/>
  </g>
</svg>
