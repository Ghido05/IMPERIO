<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Walnut Wood Gradient -->
    <linearGradient id="orgWalnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Gold Pipe Gradient -->
    <linearGradient id="orgPipeGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Silver Pipe Gradient -->
    <linearGradient id="orgPipeSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="orgShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#orgShadow)">
    <!-- CATHEDRAL ORGAN PIPES (Façade) -->
    <!-- Pipe 1 (Outer Left, medium) -->
    <rect x="18" y="28" width="6" height="34" rx="3" fill="url(#orgPipeSilver)" stroke="#fef08a" stroke-width="1"/>
    <polygon points="18,52 21,48 24,52" fill="#0f172a"/>

    <!-- Pipe 2 (Left, taller) -->
    <rect x="27" y="20" width="6.5" height="42" rx="3.2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="1.2"/>
    <polygon points="27,52 30.25,48 33.5,52" fill="#0f172a"/>

    <!-- Pipe 3 (Center-Left, tall) -->
    <rect x="36" y="13" width="7" height="49" rx="3.5" fill="url(#orgPipeSilver)" stroke="#fef08a" stroke-width="1.2"/>
    <polygon points="36,52 39.5,47 43,52" fill="#0f172a"/>

    <!-- Pipe 4 (CENTER MASTER TALL PIPE) -->
    <rect x="46" y="7" width="8" height="55" rx="4" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="1.5"/>
    <polygon points="46,52 50,46 54,52" fill="#0f172a"/>

    <!-- Pipe 5 (Center-Right, tall) -->
    <rect x="57" y="13" width="7" height="49" rx="3.5" fill="url(#orgPipeSilver)" stroke="#fef08a" stroke-width="1.2"/>
    <polygon points="57,52 60.5,47 64,52" fill="#0f172a"/>

    <!-- Pipe 6 (Right, taller) -->
    <rect x="66.5" y="20" width="6.5" height="42" rx="3.2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="1.2"/>
    <polygon points="66.5,52 69.75,48 73,52" fill="#0f172a"/>

    <!-- Pipe 7 (Outer Right, medium) -->
    <rect x="76" y="28" width="6" height="34" rx="3" fill="url(#orgPipeSilver)" stroke="#fef08a" stroke-width="1"/>
    <polygon points="76,52 79,48 82,52" fill="#0f172a"/>

    <!-- GOLD ARCHED MOLDING / PIPE SHADOW FRAME -->
    <path d="M14 62 L86 62 L88 66 L12 66 Z" fill="url(#orgPipeGold)" stroke="#78350f" stroke-width="1"/>

    <!-- WALNUT ORGAN CONSOLE CHEST -->
    <rect x="12" y="66" width="76" height="24" rx="3" fill="url(#orgWalnut)" stroke="url(#orgPipeGold)" stroke-width="2.2"/>

    <!-- DUAL MANUAL KEYBOARDS -->
    <!-- Manual 1 (Upper) -->
    <rect x="22" y="70" width="56" height="6.5" fill="#f8fafc" rx="1"/>
    <!-- Black Keys -->
    <rect x="26" y="70" width="3" height="4" fill="#0f172a"/>
    <rect x="33" y="70" width="3" height="4" fill="#0f172a"/>
    <rect x="44" y="70" width="3" height="4" fill="#0f172a"/>
    <rect x="51" y="70" width="3" height="4" fill="#0f172a"/>
    <rect x="58" y="70" width="3" height="4" fill="#0f172a"/>
    <rect x="69" y="70" width="3" height="4" fill="#0f172a"/>

    <!-- Manual 2 (Lower) -->
    <rect x="22" y="78" width="56" height="6.5" fill="#f8fafc" rx="1"/>
    <!-- Black Keys -->
    <rect x="28" y="78" width="3" height="4" fill="#0f172a"/>
    <rect x="35" y="78" width="3" height="4" fill="#0f172a"/>
    <rect x="46" y="78" width="3" height="4" fill="#0f172a"/>
    <rect x="53" y="78" width="3" height="4" fill="#0f172a"/>
    <rect x="60" y="78" width="3" height="4" fill="#0f172a"/>
    <rect x="71" y="78" width="3" height="4" fill="#0f172a"/>

    <!-- Stop Knobs (Drawknobs on side jambs) -->
    <circle cx="17" cy="73" r="2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="0.8"/>
    <circle cx="17" cy="80" r="2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="0.8"/>
    <circle cx="83" cy="73" r="2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="0.8"/>
    <circle cx="83" cy="80" r="2" fill="url(#orgPipeGold)" stroke="#fef08a" stroke-width="0.8"/>
  </g>
</svg>
