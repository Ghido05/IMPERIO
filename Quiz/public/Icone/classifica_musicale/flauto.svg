<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Silver Flute Gradient -->
    <linearGradient id="fltSilver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <!-- Gold Accent Gradient -->
    <linearGradient id="fltGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="fltShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#fltShadow)">
    <!-- Swirling Breath & Melody Breeze (Background) -->
    <path d="M68 22 C78 14 88 18 86 28 C84 34 76 32 80 40" stroke="url(#fltGold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="86" cy="18" r="2" fill="#fef08a"/>
    <path d="M18 72 C26 80 38 78 34 68" stroke="url(#fltGold)" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- CONCERT TRANSVERSE FLUTE (Slanted -35 deg) -->
    <g transform="rotate(-35 50 50)">
      <!-- Main Cylinder Tube -->
      <rect x="6" y="46.5" width="88" height="7" rx="3.5" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="2"/>

      <!-- Crown & Cork (Left End) -->
      <path d="M6 46.5 C3 46.5 3 53.5 6 53.5 Z" fill="url(#fltGold)" stroke="#fef08a" stroke-width="1"/>
      <line x1="24" y1="46.5" x2="24" y2="53.5" stroke="url(#fltGold)" stroke-width="1.5"/>

      <!-- Gold Lip Plate & Embouchure Hole (Bocchino) -->
      <rect x="14" y="44" width="8" height="12" rx="3" fill="url(#fltGold)" stroke="#fef08a" stroke-width="1"/>
      <ellipse cx="18" cy="50" rx="2.5" ry="3.2" fill="#0f172a"/>

      <!-- Connecting Key Rod -->
      <line x1="28" y1="44" x2="84" y2="44" stroke="url(#fltSilver)" stroke-width="1.8"/>

      <!-- Tone Keys (Padded Key Cups with Gold Centers) -->
      <circle cx="32" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="32" cy="43" r="1.5" fill="url(#fltGold)"/>

      <circle cx="39" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="39" cy="43" r="1.5" fill="url(#fltGold)"/>

      <circle cx="46" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="46" cy="43" r="1.5" fill="url(#fltGold)"/>

      <circle cx="53" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="53" cy="43" r="1.5" fill="url(#fltGold)"/>

      <circle cx="60" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="60" cy="43" r="1.5" fill="url(#fltGold)"/>

      <circle cx="67" cy="43" r="3.2" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1.2"/>
      <circle cx="67" cy="43" r="1.5" fill="url(#fltGold)"/>

      <!-- Footjoint Low Keys -->
      <circle cx="75" cy="43" r="2.8" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1"/>
      <circle cx="81" cy="43" r="2.8" fill="url(#fltSilver)" stroke="url(#fltGold)" stroke-width="1"/>
    </g>
  </g>
</svg>
