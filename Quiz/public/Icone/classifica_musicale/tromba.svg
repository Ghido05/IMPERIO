<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Brass Gold Gradient -->
    <linearGradient id="trmBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Bell Flare Radial Gradient -->
    <radialGradient id="trmBell" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Drop Shadow Filter -->
    <filter id="trmShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#trmShadow)">
    <!-- SOUND BLAST RINGS (Emanating from Bell) -->
    <path d="M86 34 C94 42 94 58 86 66" stroke="url(#trmBrass)" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M92 26 C102 38 102 62 92 74" stroke="url(#trmBrass)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

    <!-- TRUMPET BODY -->
    <!-- Mouthpiece (Left) -->
    <path d="M8 48 L14 49.5 L14 52.5 L8 54 Z" fill="url(#trmBrass)" stroke="#fef08a" stroke-width="1.2"/>
    <rect x="14" y="49" width="3" height="4" rx="0.5" fill="#fef08a"/>
    <!-- Leadpipe -->
    <line x1="17" y1="51" x2="38" y2="51" stroke="url(#trmBrass)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Valve Casing Block (Ottone Massiccio) -->
    <rect x="38" y="38" width="24" height="28" rx="2" fill="url(#trmBrass)" stroke="#78350f" stroke-width="1.5"/>

    <!-- 3 Vertical Piston Valves -->
    <!-- Valve 1 -->
    <line x1="42" y1="28" x2="42" y2="38" stroke="url(#trmBrass)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="42" cy="27" rx="3" ry="1.8" fill="#f8fafc" stroke="url(#trmBrass)" stroke-width="1.2"/>
    <line x1="42" y1="38" x2="42" y2="66" stroke="#fef08a" stroke-width="2"/>
    <circle cx="42" cy="68" r="2.2" fill="url(#trmBrass)"/>

    <!-- Valve 2 -->
    <line x1="50" y1="28" x2="50" y2="38" stroke="url(#trmBrass)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="50" cy="27" rx="3" ry="1.8" fill="#f8fafc" stroke="url(#trmBrass)" stroke-width="1.2"/>
    <line x1="50" y1="38" x2="50" y2="66" stroke="#fef08a" stroke-width="2"/>
    <circle cx="50" cy="68" r="2.2" fill="url(#trmBrass)"/>

    <!-- Valve 3 -->
    <line x1="58" y1="28" x2="58" y2="38" stroke="url(#trmBrass)" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="58" cy="27" rx="3" ry="1.8" fill="#f8fafc" stroke="url(#trmBrass)" stroke-width="1.2"/>
    <line x1="58" y1="38" x2="58" y2="66" stroke="#fef08a" stroke-width="2"/>
    <circle cx="58" cy="68" r="2.2" fill="url(#trmBrass)"/>

    <!-- Tuning Slides / Tubing Loops -->
    <!-- Rear Loop -->
    <path d="M38 60 C24 60 24 42 38 42" stroke="url(#trmBrass)" stroke-width="4" fill="none"/>
    <path d="M38 60 C24 60 24 42 38 42" stroke="#fef08a" stroke-width="1.2" fill="none"/>

    <!-- Upper Bell Pipe -->
    <line x1="62" y1="44" x2="72" y2="44" stroke="url(#trmBrass)" stroke-width="4.5"/>
    <line x1="62" y1="43" x2="72" y2="43" stroke="#fef08a" stroke-width="1.2"/>

    <!-- Flared Bell Horn (Padiglione Svasato in Ottone) -->
    <path d="M72 44 C78 44 82 38 85 32 L85 68 C82 62 78 56 72 56 Z" 
          fill="url(#trmBell)" stroke="url(#trmBrass)" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="85" cy="50" rx="3.5" ry="18" fill="url(#trmBrass)" stroke="#fef08a" stroke-width="2"/>
    <ellipse cx="85" cy="50" rx="1.5" ry="12" fill="#78350f"/>
  </g>
</svg>
