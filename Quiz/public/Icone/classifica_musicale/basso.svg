<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Sunburst Body Gradient -->
    <radialGradient id="bassSunburst" cx="62%" cy="68%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#b91c1c"/>
      <stop offset="90%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <!-- Gold Gradient -->
    <linearGradient id="bassGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Maple Wood Neck -->
    <linearGradient id="bassMaple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="bassShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#bassShadow)" transform="rotate(-38 50 50)">
    <!-- 4 CLOVERLEAF / ELEPHANT-EAR BASS TUNERS (Headstock) -->
    <!-- Tuner 1 (Top) -->
    <circle cx="43" cy="7" r="3.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
    <ellipse cx="43" cy="7" rx="1.8" ry="0.9" fill="#78350f"/>
    <line x1="45.5" y1="7" x2="49" y2="7" stroke="url(#bassGold)" stroke-width="1.8"/>

    <!-- Tuner 2 -->
    <circle cx="43" cy="11.5" r="3.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
    <ellipse cx="43" cy="11.5" rx="1.8" ry="0.9" fill="#78350f"/>
    <line x1="45.5" y1="11.5" x2="49" y2="11.5" stroke="url(#bassGold)" stroke-width="1.8"/>

    <!-- Tuner 3 -->
    <circle cx="43" cy="16" r="3.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
    <ellipse cx="43" cy="16" rx="1.8" ry="0.9" fill="#78350f"/>
    <line x1="45.5" y1="16" x2="49" y2="16" stroke="url(#bassGold)" stroke-width="1.8"/>

    <!-- Tuner 4 -->
    <circle cx="43" cy="20.5" r="3.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
    <ellipse cx="43" cy="20.5" rx="1.8" ry="0.9" fill="#78350f"/>
    <line x1="45.5" y1="20.5" x2="49" y2="20.5" stroke="url(#bassGold)" stroke-width="1.8"/>

    <!-- Headstock Body -->
    <path d="M48 5 L53 5 C55 10 56 18 54 23 L48 23 Z" fill="url(#bassMaple)" stroke="url(#bassGold)" stroke-width="1.5"/>
    <circle cx="51" cy="7" r="1.2" fill="#78350f"/>

    <!-- Long Bass Neck -->
    <rect x="48.5" y="23" width="5.5" height="34" fill="url(#bassMaple)" stroke="url(#bassGold)" stroke-width="1.2"/>
    <!-- Rosewood Fretboard Lines & Pearloid Inlays -->
    <line x1="48.5" y1="28" x2="54" y2="28" stroke="#78350f" stroke-width="1"/>
    <line x1="48.5" y1="34" x2="54" y2="34" stroke="#78350f" stroke-width="1"/>
    <circle cx="51.2" cy="37" r="1.1" fill="#f8fafc"/>
    <line x1="48.5" y1="40" x2="54" y2="40" stroke="#78350f" stroke-width="1"/>
    <line x1="48.5" y1="46" x2="54" y2="46" stroke="#78350f" stroke-width="1"/>
    <circle cx="51.2" cy="49" r="1.1" fill="#f8fafc"/>
    <line x1="48.5" y1="52" x2="54" y2="52" stroke="#78350f" stroke-width="1"/>

    <!-- Solid Electric Bass Body (Asymmetrical Contoured Double Cutaway) -->
    <path d="M46 54 C40 48 37 53 40 60 C41 64 37 69 38 78 C39 88 47 93 56 92 C66 91 70 82 68 73 C67 65 61 63 61 58 C61 53 58 51 55 54 Z" 
          fill="url(#bassSunburst)" stroke="url(#bassGold)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Pearloid Pickguard with Gold Border -->
    <path d="M44 62 C41 68 42 77 48 83 C54 86 58 83 58 74 C58 66 52 60 46 60 Z" 
          fill="#f8fafc" fill-opacity="0.9" stroke="url(#bassGold)" stroke-width="1.2"/>

    <!-- Split-Coil Precision Bass Pickups -->
    <rect x="47" y="63" width="4" height="3" rx="0.8" fill="#0f172a" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="48" cy="64.5" r="0.8" fill="#f8fafc"/>
    <circle cx="50" cy="64.5" r="0.8" fill="#f8fafc"/>

    <rect x="50" y="67" width="4" height="3" rx="0.8" fill="#0f172a" stroke="#cbd5e1" stroke-width="0.8"/>
    <circle cx="51" cy="68.5" r="0.8" fill="#f8fafc"/>
    <circle cx="53" cy="68.5" r="0.8" fill="#f8fafc"/>

    <!-- Heavy 4-Saddle Bass Bridge -->
    <rect x="48.5" y="78" width="7" height="4.5" rx="1" fill="url(#bassGold)" stroke="#ffffff" stroke-width="0.8"/>

    <!-- 4 Heavy Bass Strings (Steel) -->
    <line x1="49.5" y1="6" x2="49.5" y2="80" stroke="#f8fafc" stroke-width="1.2"/>
    <line x1="50.7" y1="6" x2="50.7" y2="80" stroke="#f8fafc" stroke-width="1.0"/>
    <line x1="51.8" y1="6" x2="51.8" y2="80" stroke="#f8fafc" stroke-width="0.9"/>
    <line x1="52.9" y1="6" x2="52.9" y2="80" stroke="#f8fafc" stroke-width="0.8"/>

    <!-- Gold Knurled Volume & Tone Knobs -->
    <circle cx="60" cy="80" r="2.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
    <circle cx="63" cy="74" r="2.2" fill="url(#bassGold)" stroke="#fde047" stroke-width="0.8"/>
  </g>

  <!-- Glowing Bass Clef Badge / Deep Soundwave (Bottom Right) -->
  <g transform="translate(68, 64) scale(0.9)">
    <circle cx="16" cy="16" r="15" fill="#1e1b4b" stroke="url(#bassGold)" stroke-width="2"/>
    <!-- Bass Clef (Chiave di Basso / Fa) in Gold -->
    <path d="M12 21 C12 17 15 13 19 13 C22 13 23 15 22 17 C21 19 18 19 18 17 C18 15 19 15 19 15 M22 17 C23 23 17 26 13 27" 
          stroke="url(#bassGold)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <circle cx="23" cy="13" r="1.5" fill="#fde047"/>
    <circle cx="23" cy="19" r="1.5" fill="#fde047"/>
  </g>
</svg>
