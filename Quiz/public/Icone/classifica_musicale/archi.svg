<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Violin Varnish Gradient -->
    <radialGradient id="vlnVarnish" cx="48%" cy="58%" r="55%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="90%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <!-- Gold Gradient -->
    <linearGradient id="vlnGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Ebony Gradient -->
    <linearGradient id="vlnEbony" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="vlnShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#vlnShadow)">
    <!-- VIOLIN BODY & NECK (Angled 35 deg) -->
    <g transform="rotate(-32 50 50)">
      <!-- Carved Scroll (Riccio) & Pegbox -->
      <path d="M48 4 C46 1 54 1 52 4 C50 6 52 8 52 10 L48 10 Z" fill="#b45309" stroke="url(#vlnGold)" stroke-width="1.2"/>
      <circle cx="50" cy="4" r="2.2" stroke="url(#vlnGold)" stroke-width="1.2" fill="#78350f"/>
      
      <!-- 4 Boxwood Pegs (Piroli with Gold Pins) -->
      <line x1="43" y1="12" x2="48" y2="12" stroke="url(#vlnGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="43" cy="12" r="1.5" fill="#fef08a"/>
      <line x1="43" y1="16" x2="48" y2="16" stroke="url(#vlnGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="43" cy="16" r="1.5" fill="#fef08a"/>
      <line x1="52" y1="12" x2="57" y2="12" stroke="url(#vlnGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="57" cy="12" r="1.5" fill="#fef08a"/>
      <line x1="52" y1="16" x2="57" y2="16" stroke="url(#vlnGold)" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="57" cy="16" r="1.5" fill="#fef08a"/>

      <!-- Maple Neck & Ebony Fingerboard -->
      <rect x="47.5" y="10" width="5" height="34" fill="url(#vlnEbony)" stroke="url(#vlnGold)" stroke-width="1.2"/>

      <!-- Hand-Carved Violin Body with C-Bouts -->
      <path d="M47 30 C38 30 35 37 38 43 C39 46 36 49 35 52 C32 55 32 58 36 60 C41 62 42 65 39 71 C34 78 37 87 45 90 C50 91.5 50 91.5 55 90 C63 87 66 78 61 71 C58 65 59 62 64 60 C68 58 68 55 65 52 C64 49 61 46 62 43 C65 37 62 30 53 30 Z" 
            fill="url(#vlnVarnish)" stroke="url(#vlnGold)" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- Delicate Purfling Inlay Line -->
      <path d="M48 33 C41 33 38 39 40 44 C42 47 39 50 37 53 C35 56 36 57 39 59 C43 61 45 64 42 69 C38 76 41 84 47 87 C50 88 50 88 53 87 C59 84 62 76 58 69 C55 64 57 61 61 59 C64 57 65 56 63 53 C61 50 58 47 60 44 C62 39 59 33 52 33 Z" 
            fill="none" stroke="#78350f" stroke-width="0.8" opacity="0.6"/>

      <!-- Dual Carved f-holes (Effe) -->
      <!-- Left f-hole -->
      <path d="M41 50 C39 53 42 56 42 59 C42 62 39 65 41 68" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle cx="41" cy="50" r="1.3" fill="#1e1b4b"/>
      <circle cx="41" cy="68" r="1.3" fill="#1e1b4b"/>

      <!-- Right f-hole -->
      <path d="M59 50 C61 53 58 56 58 59 C58 62 61 65 59 68" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle cx="59" cy="50" r="1.3" fill="#1e1b4b"/>
      <circle cx="59" cy="68" r="1.3" fill="#1e1b4b"/>

      <!-- Sculpted Maple Bridge -->
      <rect x="46" y="63" width="8" height="2.5" rx="0.6" fill="#fef3c7" stroke="url(#vlnGold)" stroke-width="0.8"/>

      <!-- Ebony Tailpiece with 4 Gold Fine Tuners -->
      <path d="M48 68 L52 68 L53.5 84 L46.5 84 Z" fill="url(#vlnEbony)" stroke="url(#vlnGold)" stroke-width="1"/>
      <circle cx="48.5" cy="70" r="0.7" fill="#fef08a"/>
      <circle cx="49.5" cy="70" r="0.7" fill="#fef08a"/>
      <circle cx="50.5" cy="70" r="0.7" fill="#fef08a"/>
      <circle cx="51.5" cy="70" r="0.7" fill="#fef08a"/>

      <!-- Ebony Chinrest on Lower Bout -->
      <ellipse cx="42" cy="85" rx="4.5" ry="3.5" fill="url(#vlnEbony)" stroke="url(#vlnGold)" stroke-width="1"/>

      <!-- 4 Steel Strings -->
      <line x1="48" y1="10" x2="48" y2="68" stroke="#f8fafc" stroke-width="0.7"/>
      <line x1="49.3" y1="10" x2="49.3" y2="68" stroke="#f8fafc" stroke-width="0.7"/>
      <line x1="50.6" y1="10" x2="50.6" y2="68" stroke="#f8fafc" stroke-width="0.7"/>
      <line x1="52" y1="10" x2="52" y2="68" stroke="#f8fafc" stroke-width="0.7"/>
    </g>

    <!-- PERNAMBUCO WOODEN BOW (Archetto) Crossing Diagonally -->
    <!-- Wooden Stick in Rich Mahogany -->
    <line x1="12" y1="72" x2="88" y2="28" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
    <line x1="12" y1="72" x2="88" y2="28" stroke="url(#vlnGold)" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Horsehair (Crini) -->
    <line x1="15" y1="75" x2="86" y2="31" stroke="#f8fafc" stroke-width="1.4" stroke-linecap="round"/>
    <!-- Frog (Tallone in Ebano con Vite d'Oro) -->
    <rect x="12" y="70" width="6" height="5" rx="1" transform="rotate(-30 15 72.5)" fill="url(#vlnEbony)" stroke="url(#vlnGold)" stroke-width="1"/>
    <circle cx="12" cy="74" r="1.5" fill="#fef08a"/>
    <!-- Tip (Punta d'Avorio) -->
    <circle cx="88" cy="28" r="2" fill="#f8fafc" stroke="url(#vlnGold)" stroke-width="0.8"/>
  </g>
</svg>
