<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Rich Walnut Wood for Side Cheeks -->
    <linearGradient id="synthWalnut" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <!-- Graphite Metal Chassis -->
    <linearGradient id="synthGraphite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Gold Hardware Gradient -->
    <linearGradient id="synthGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- OLED Screen Gradient -->
    <linearGradient id="synthOled" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0c4a6e"/>
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="synthShadow" x="-10%" y="-10%" width="125%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="1" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#synthShadow)">
    <!-- LEFT WALNUT WOODEN SIDE CHEEK (Moog / Prophet Style) -->
    <path d="M12 28 L18 22 L18 78 L12 84 Z" fill="url(#synthWalnut)" stroke="url(#synthGold)" stroke-width="1.8"/>
    <circle cx="15" cy="30" r="1.5" fill="url(#synthGold)"/>
    <circle cx="15" cy="76" r="1.5" fill="url(#synthGold)"/>

    <!-- RIGHT WALNUT WOODEN SIDE CHEEK -->
    <path d="M82 22 L88 28 L88 84 L82 78 Z" fill="url(#synthWalnut)" stroke="url(#synthGold)" stroke-width="1.8"/>
    <circle cx="85" cy="30" r="1.5" fill="url(#synthGold)"/>
    <circle cx="85" cy="76" r="1.5" fill="url(#synthGold)"/>

    <!-- MAIN CHASSIS BODY -->
    <rect x="18" y="22" width="64" height="58" rx="2" fill="url(#synthGraphite)" stroke="url(#synthGold)" stroke-width="2"/>

    <!-- CONTROL PANEL DECK (Slanted Top Area) -->
    <rect x="21" y="25" width="58" height="28" rx="2" fill="#0f172a" stroke="#475569" stroke-width="1.2"/>

    <!-- Glowing OLED Audio Waveform Screen (Center) -->
    <rect x="38" y="28" width="24" height="15" rx="2" fill="url(#synthOled)" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Glowing Audio Synth Wave -->
    <path d="M40 35.5 Q43 29 46 35.5 T52 35.5 T58 35.5 T60 35.5" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
    <text x="41" y="32" font-family="sans-serif" font-weight="900" font-size="3" fill="#fef08a">ANALOG SYNTH</text>

    <!-- Rotary Knobs (Left Panel) -->
    <circle cx="26" cy="32" r="3.2" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>
    <line x1="26" y1="30" x2="26" y2="32" stroke="#38bdf8" stroke-width="1.5"/>

    <circle cx="33" cy="32" r="3.2" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>
    <line x1="33" y1="30" x2="33" y2="32" stroke="#38bdf8" stroke-width="1.5"/>

    <circle cx="26" cy="42" r="3.2" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>
    <circle cx="33" cy="42" r="3.2" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>

    <!-- Equalizer Sliders / Faders (Right Panel) -->
    <line x1="66" y1="29" x2="66" y2="44" stroke="#475569" stroke-width="1.5"/>
    <rect x="64.5" y="33" width="3" height="4.5" rx="0.8" fill="#f43f5e" stroke="#ffffff" stroke-width="0.6"/>

    <line x1="71" y1="29" x2="71" y2="44" stroke="#475569" stroke-width="1.5"/>
    <rect x="69.5" y="37" width="3" height="4.5" rx="0.8" fill="#10b981" stroke="#ffffff" stroke-width="0.6"/>

    <line x1="76" y1="29" x2="76" y2="44" stroke="#475569" stroke-width="1.5"/>
    <rect x="74.5" y="31" width="3" height="4.5" rx="0.8" fill="#f59e0b" stroke="#ffffff" stroke-width="0.6"/>

    <!-- PITCH BEND & MODULATION WHEELS (Left of Keybed) -->
    <rect x="21" y="56" width="4.5" height="18" rx="1.5" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>
    <line x1="21" y1="65" x2="25.5" y2="65" stroke="#38bdf8" stroke-width="1.5"/>

    <rect x="27" y="56" width="4.5" height="18" rx="1.5" fill="#334155" stroke="url(#synthGold)" stroke-width="1"/>
    <line x1="27" y1="65" x2="31.5" y2="65" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- SYNTH KEYBED (White Keys) -->
    <rect x="33" y="55" width="46" height="21" rx="1" fill="#f8fafc" stroke="url(#synthGold)" stroke-width="1.5"/>
    <!-- Key Lines -->
    <line x1="37.6" y1="55" x2="37.6" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="42.2" y1="55" x2="42.2" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="46.8" y1="55" x2="46.8" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="51.4" y1="55" x2="51.4" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="56.0" y1="55" x2="56.0" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="60.6" y1="55" x2="60.6" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="65.2" y1="55" x2="65.2" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="69.8" y1="55" x2="69.8" y2="76" stroke="#94a3b8" stroke-width="1"/>
    <line x1="74.4" y1="55" x2="74.4" y2="76" stroke="#94a3b8" stroke-width="1"/>

    <!-- Black Keys -->
    <rect x="36.0" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="40.6" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="49.8" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="54.4" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="59.0" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="68.2" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
    <rect x="72.8" y="55" width="2.8" height="12" fill="#0f172a" rx="0.5"/>
  </g>
</svg>
